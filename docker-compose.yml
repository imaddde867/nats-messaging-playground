# IAOP Learning Environment — NATS with JetStream
# Run: docker compose up -d
# This gives you a production-grade message broker in one command.

services:
  nats:
    image: nats:latest
    container_name: iaop-nats
    ports:
      - "4222:4222"   # Client connections (your Python code connects here)
      - "8222:8222"   # HTTP monitoring (open in browser to see stats)
    command: >
      --jetstream
      --store_dir /data
      --name iaop-broker
      --http_port 8222
    volumes:
      - nats-data:/data
    restart: unless-stopped

volumes:
  nats-data:
